plugins {
	id 'net.fabricmc.fabric-loom' version '1.15.+'
	id 'maven-publish'
	id "me.modmuss50.mod-publish-plugin" version "2.2.0"
}

var isStable = project.is_stable == "true"

base {
	archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group


repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
	maven { url 'https://maven.nucleoid.xyz' }
	//maven { url 'https://maven.gegy.dev' }
	maven { url "https://api.modrinth.com/maven" }
	mavenLocal()
	mavenCentral()
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	compileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	localRuntime("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}")

	//modCompileOnly fabricApi.module("fabric-api-base", project.fabric_version)
	//modLocalRuntime fabricApi.module("fabric-api-base", project.fabric_version)

	implementation include("eu.pb4:predicate-api:0.10.0+26.3")
	implementation include("eu.pb4:placeholder-api:3.2.0+26.3")
	implementation include("eu.pb4:player-data-api:0.11.0+26.2")
	compileOnly "me.lucko:fabric-permissions-api:0.7.0"

	//compileOnly("maven.modrinth:vanish:1.5.2+1.20.4")
	//modLocalRuntime("fr.catcore:server-translations-api:1.4.17+1.19.2")

	//modRuntime "supercoder79:databreaker:0.2.7"
	// PSA: Some older mods, compiled on Loom 0.2.1, might have outdated Maven POMs.
	// You may need to force-disable transitiveness on them.
}

loom {
	accessWidenerPath = file("src/main/resources/styledchat.accesswidener")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	// ensure that the encoding is set to UTF-8, no matter what the system default is
	// this fixes some edge cases with special characters not displaying correctly
	// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
	// If Javadoc is generated, this must be specified in that task too.
	it.options.encoding = "UTF-8"

	// Minecraft 1.17 (21w19a) upwards uses Java 16.
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			// add all the jars that should be included when publishing to maven
			artifact(jar) {
				builtBy jar
			}
			artifact(sourcesJar) {
				builtBy sourcesJar
			}
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

publishMods {
	changelog = System.getenv("CHANGELOG")
	type = project.mod_version.contains("-") ? BETA : STABLE
	file = jar.archiveFile
	modLoaders.add("fabric")

	if (System.getenv("CURSEFORGE")) {
		curseforge {
			projectId = "493348"
			accessToken = System.getenv("CURSEFORGE")
			client = true
			server = true

			minecraftVersions.add((project.minecraft_version.contains("-") ? ((String) project.minecraft_version.split("-")[0] + "-snapshot") : project.minecraft_version))
			for (String a : project.mc_extra_supported.split(",")) {
				if (!a.strip().isEmpty()) {
					minecraftVersions.add(a.strip())
				}
			}

			requires("polymer")
		}
	}

	if (System.getenv("MODRINTH")) {
		modrinth {
			accessToken = System.getenv("MODRINTH")
			projectId = 'doqSKB0e'

			minecraftVersions.add(project.minecraft_version);
			for (String a : project.mc_extra_supported.split(",")) {
				if (!a.strip().isEmpty()) {
					minecraftVersions.add(a.strip())
				}
			}

			requires("polymer")
		}
	}
}